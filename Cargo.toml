[package]
name = "pbi-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bounded native Rust source search and cited model answers"
license = "Apache-2.0"
default-run = "pbi-rs"

[lib]
name = "pbi_rs"
path = "src/lib.rs"

[dependencies]
# Pure Rust grammar, run only in the bounded same-image parser worker.
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = { version = "=0.153.0", default-features = false }
oxc_span = "=0.153.0"
# English-only Porter stemmer for the fixtures; none existed before #316.
porter-stemmer = "=0.1.2"
# Reuse the locked syntax crates; stemming adds only its English implementation
# and unicode-segmentation transitive dependency.
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.149"
ignore = "=0.4.25"
# Already locked transitively; bounded regex search uses the same engine.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
libc = "=0.2.189"
toml = "=0.9.12"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
workflow-adk = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "b9b1684d13533af74809fef5cc757cea8912c1fb" }
workflow-runtime = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "b9b1684d13533af74809fef5cc757cea8912c1fb" }

[dev-dependencies]
adk-rust = { version = "=2.1.0", default-features = false, features = ["agents", "models", "graph", "guardrail", "telemetry", "openai"] }
workflow-adk = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "b9b1684d13533af74809fef5cc757cea8912c1fb", features = ["test-support"] }

[[bin]]
name = "pbi-rs"
path = "src/main.rs"
