[package]
name = "pbi-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A fail-closed Rust front end for Probe-backed source evidence"
license = "MIT"
default-run = "pbi-rs"

[lib]
name = "pbi_rs"
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
workflow-adk = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "42b1834682e433c30e23527c9234c8acc821426b" }
workflow-runtime = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "42b1834682e433c30e23527c9234c8acc821426b" }

[dev-dependencies]
adk-rust = { version = "=2.1.0", default-features = false, features = ["agents", "models", "graph", "guardrail", "telemetry", "openai"] }
workflow-adk = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "42b1834682e433c30e23527c9234c8acc821426b", features = ["test-support"] }

[[bin]]
name = "pbi-rs"
path = "src/main.rs"
