[package]
name = "pbi-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A fail-closed Rust front end for Probe-backed source evidence"
license = "MIT"
default-run = "pbi-rs"

[lib]
name = "pbi_rs"
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
workflow-adk = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "41722ebac602639baad97e36170b83135172b766" }
workflow-runtime = { git = "https://github.com/RyderFreeman4Logos/adk-workflow-kit", rev = "41722ebac602639baad97e36170b83135172b766" }

[[bin]]
name = "pbi-rs"
path = "src/main.rs"
